</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">JB SRUR<small>GESTIÓN DE LIMPIEZAS</small></div><div><p class="workspace">Mi espacio</p><nav class="side-nav" id="sidenav"></nav></div><div class="side-bottom">Cada espacio,<br>listo para lo que viene.<div class="person"><span class="avatar" id="avatar">M</span><div><strong id="personName">Mili</strong><small id="personRole">Equipo de limpieza</small></div></div></div></aside><main>

<div class="mobile-nav hidden" id="mobilenav"></div><div class="heading"><div><div class="eyebrow" id="greeting">TU AGENDA, EN ORDEN</div><h1 id="title">Limpiezas de esta semana</h1><p class="sub" id="subtitle"></p></div><button id="add" class="primary hidden">＋ Nueva limpieza</button></div>
<div id="notice"></div><section id="stats" class="stats" aria-label="Resumen semanal"></section><section id="next"></section>

<script>
// Solo esta URL es pública. Nunca agregar contraseñas al HTML ni al repositorio.
const APPS_SCRIPT_URL = '';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATES=['Pendiente','En proceso','Realizada','Reprogramada'];
const ROLE_NAMES={admin:'Administración',cleaner:'Equipo de limpieza'};
const readStore=(k,otherwise)=>{try{return JSON.parse(localStorage.getItem(k))??otherwise}catch{return otherwise}};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Cordoba',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const shift=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const monday=s=>shift(s,-((new Date(s+'T12:00:00Z').getUTCDay()+6)%7));
const label=(s,opts={day:'numeric',month:'long'})=>new Date(s+'T12:00:00Z').toLocaleDateString('es-AR',{...opts,timeZone:'UTC'});
const DEMO_USER={id:'mili',name:'Mili',role:'cleaner'}, DEMO_ADMIN={id:'admin',name:'Administración',role:'admin'};
const demoUsers=()=>[{id:'admin',name:'Administración',role:'admin'},{id:'mili',name:'Mili',role:'cleaner'},{id:'lucia',name:'Lucía',role:'cleaner'}];
let mode='demo',user={...DEMO_USER},users=demoUsers(),tasks=[],tab='week',page='agenda',week=monday(today()),day='',key='',url=APPS_SCRIPT_URL||readStore('srur-url',''),busy=false,polling=false;
const admin=()=>user.role==='admin';
const userName=id=>users.find(u=>u.id===id)?.name||id;
function seed(){const base=monday(today());return [['Rondeau 450','5° F',0,'09:30','Pendiente','mili'],['Ayacucho 165','5° D',1,'10:00','Pendiente','mili'],['Obispo Trejo 860','2° A',2,'11:00','Realizada','mili'],['Independencia 1200','3° B',4,'09:00','Reprogramada','mili'],['Buenos Aires 740','1° C',1,'14:00','En proceso','lucia'],['Rondeau 450','5° F',8,'10:00','Pendiente','mili']].map((x,i)=>({id:'demo-'+i,propiedad:'Departamento '+(i+1),direccion:x[0],unidad:x[1],fecha:shift(base,x[2]),hora:x[3],duracion:'90',tipo:'Limpieza general',estado:x[4],llaves:'En recepción',observaciones:'Dejar listo para visitas. Revisar cocina y baño antes de salir.',responsable:x[5],version:'1',eliminada:'0',comentarios:i===2?'Todo en orden. Faltaría reponer papel de cocina.':''}))}
function loadDemo(){tasks=readStore('srur-demo-v2',null)||seed()}
function visible(){return tasks.filter(t=>t.eliminada!=='1')}
function badge(t){return '<span class="badge s'+STATES.indexOf(t.estado)+'">'+esc(t.estado)+'</span>'}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function keyBox(t){return '<div class="key '+(/confirmar|pendiente/i.test(t.llaves)?'warning':'')+'"><span aria-hidden="true">⚿</span><div><strong>LLAVES</strong>'+esc(t.llaves)+'</div></div>'}
function card(t){const overdue=t.estado!=='Realizada'&&new Date(t.fecha+'T'+t.hora+':00-03:00')<new Date();return '<article class="card"><div class="card-top"><span class="time">'+esc(t.hora)+' <small>hs</small></span>'+badge(t)+'</div><h2>'+esc(t.direccion)+'</h2><div class="unit">'+esc(t.unidad)+'</div><div class="type">'+esc(t.tipo)+'</div>'+keyBox(t)+(t.comentarios?'<p class="comment">💬 '+esc(t.comentarios)+'</p>':'')+(overdue?'<p class="overdue">Horario transcurrido · '+esc(t.estado.toLowerCase())+'</p>':'')+'<div class="card-bottom"><span>◷ '+Number(t.duracion)+' min · '+esc(userName(t.responsable))+'</span><button data-detail="'+esc(t.id)+'">Ver detalle ↗</button></div></article>'}
function render(){const all=visible(),wk=all.filter(t=>t.fecha>=week&&t.fecha<=shift(week,6));$('#title').textContent=page==='users'?'Usuarios y contraseñas':page==='properties'?'Propiedades':page==='history'?'Limpiezas realizadas':tab==='today'?'Limpiezas de hoy':tab==='upcoming'?'Próximas limpiezas':'Agenda de limpiezas';$('#subtitle').textContent=page==='users'?'Accesos a la agenda. Cada persona entra con su propia contraseña.':page==='properties'?'Propiedades registradas en la agenda':page==='history'?'Historial de tareas finalizadas':tab==='today'?label(today(),{weekday:'long',day:'numeric',month:'long'}):tab==='upcoming'?'Programadas a partir de mañana':'Semana del '+label(week)+' al '+label(shift(week,6));$('#greeting').textContent=admin()?'PANEL DE ADMINISTRACIÓN':'HOLA, '+user.name.toUpperCase();$('#personName').textContent=user.name;$('#personRole').textContent=ROLE_NAMES[user.role]||user.role;$('#avatar').textContent=user.name[0];$('#switchRole').textContent=admin()?'Probar vista de Mili':'Probar administración';$('#switchRole').classList.toggle('hidden',mode!=='demo');$('#modeBadge').textContent=mode==='demo'?'DEMO LOCAL':'GOOGLE SHEETS';$('#connect').textContent=mode==='demo'?'Ingresar':'Salir';$('#add').classList.toggle('hidden',page!=='agenda');$('#dateFilter').classList.toggle('hidden',page!=='agenda');const nav='<button data-page="agenda" class="'+(page==='agenda'?'active':'')+'">▦ &nbsp; Agenda</button><button data-page="properties" class="'+(page==='properties'?'active':'')+'">⌂ &nbsp; Propiedades</button><button data-page="history" class="'+(page==='history'?'active':'')+'">◷ &nbsp; Historial</button>'+(admin()?'<button data-page="users" class="'+(page==='users'?'active':'')+'">☺ &nbsp; Usuarios</button>':'<button data-password="'+esc(user.id)+'">⚿ &nbsp; Mi contraseña</button>');$('#sidenav').innerHTML=nav;$('#mobilenav').innerHTML=nav;
$('#stats').innerHTML=[['Limpiezas',wk.length,'Esta semana'],['Pendientes',wk.filter(t=>t.estado==='Pendiente').length,'Por realizar'],['Realizadas',wk.filter(t=>t.estado==='Realizada').length,'Finalizadas'],['Reprogramadas',wk.filter(t=>t.estado==='Reprogramada').length,'Nuevo horario']].map(([t,n,d])=>'<div class="stat"><div><span>'+t+'</span><small>'+d+'</small></div><b>'+n+'</b></div>').join('');$('#stats').classList.toggle('hidden',page!=='agenda');
const next=all.filter(t=>t.estado!=='Realizada'&&new Date(t.fecha+'T'+t.hora+':00-03:00')>=new Date()).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora))[0];$('#next').innerHTML=page==='agenda'&&next?'<div class="next"><span class="next-icon">↗</span><div><div class="eyebrow">PRÓXIMA LIMPIEZA</div><strong>'+esc(next.direccion)+' · '+esc(next.unidad)+'</strong><p>'+label(next.fecha,{weekday:'long',day:'numeric',month:'short'})+' · '+esc(next.hora)+' hs · '+esc(userName(next.responsable))+'</p></div><button data-detail="'+esc(next.id)+'">Ver detalle ↗</button></div>':'';
$('#tabs').classList.toggle('hidden',page!=='agenda');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#stateFilter').classList.toggle('hidden',page!=='agenda');$('#search').classList.toggle('hidden',page==='users');$('#weeknav').innerHTML=page==='agenda'&&tab==='week'?'<div class="weekbar"><div><button data-week="-1" aria-label="Semana anterior">‹</button> <button data-week="1" aria-label="Semana siguiente">›</button></div><strong>'+label(week,{month:'long',year:'numeric'})+'</strong><button data-today>Volver a hoy</button></div><div class="days">'+Array.from({length:7},(_,i)=>{const d=shift(week,i);return '<button data-day="'+d+'" class="day '+(d===today()?'today ':'')+(d===day?'active':'')+'">'+label(d,{weekday:'short'}).replace('.','')+'<b>'+Number(d.slice(-2))+'</b><span>'+wk.filter(t=>t.fecha===d).length+' tareas</span></button>'}).join('')+'</div>':'';
if(page==='users'){if(!admin()){page='agenda';return render()}$('#content').innerHTML='<div class="cards">'+users.map(u=>'<article class="prop-card user-card"><div><div class="eyebrow">'+esc(ROLE_NAMES[u.role]||u.role)+'</div><h2>'+esc(u.name)+'</h2><p>ID: '+esc(u.id)+'</p></div><div class="user-actions"><button data-password="'+esc(u.id)+'">Cambiar contraseña</button>'+(u.id!==user.id?'<button class="danger" data-remove-user="'+esc(u.id)+'">Quitar</button>':'')+'</div></article>').join('')+'</div><p class="sub" style="margin-top:22px">Cada persona ingresa con su contraseña y ve la agenda completa. Solo administración puede eliminar limpiezas y gestionar usuarios.</p><button class="primary" data-new-user style="margin-top:14px">＋ Nuevo usuario</button>';return}
const search=$('#search').value.toLocaleLowerCase();let filtered=all.filter(t=>(t.direccion+' '+t.unidad+' '+t.propiedad).toLocaleLowerCase().includes(search));if(page==='properties'){const unique=[...new Map(filtered.map(t=>[t.direccion+'|'+t.unidad,t])).values()];$('#content').innerHTML=unique.length?'<div class="cards">'+unique.map(t=>'<article class="prop-card"><div class="eyebrow">'+esc(t.propiedad)+'</div><h2>'+esc(t.direccion)+'</h2><p>'+esc(t.unidad)+'</p><p>'+all.filter(x=>x.direccion===t.direccion&&x.unidad===t.unidad).length+' limpiezas registradas</p></article>').join('')+'</div>':empty();return}
if(page==='history')filtered=filtered.filter(t=>t.estado==='Realizada');else {filtered=filtered.filter(t=>tab==='today'?t.fecha===today():tab==='upcoming'?t.fecha>today():t.fecha>=week&&t.fecha<=shift(week,6));if(day&&tab==='week')filtered=filtered.filter(t=>t.fecha===day);if($('#stateFilter').value)filtered=filtered.filter(t=>t.estado===$('#stateFilter').value)}if(page==='agenda'&&$('#dateFilter').value)filtered=filtered.filter(t=>t.fecha===$('#dateFilter').value);filtered.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)*(page==='history'?-1:1));const groups={};filtered.forEach(t=>(groups[t.fecha]??=[]).push(t));$('#content').innerHTML=filtered.length?Object.entries(groups).map(([d,ts])=>'<h2 class="agenda-title">'+(d===today()?'Hoy · ':'')+label(d,{weekday:'long',day:'numeric',month:'long'})+'</h2><div class="cards">'+ts.map(card).join('')+'</div>').join(''):empty();}
function empty(){return '<div class="empty"><b>Todo despejado por acá</b>No hay limpiezas para esta selección.<br><button class="quiet" data-reset>Limpiar filtros</button></div>'}
function openModal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function modalHead(t){return '<div class="dialog-head"><h2>'+t+'</h2><button class="close quiet" data-close aria-label="Cerrar">×</button></div>'}
function detail(id){const t=visible().find(t=>t.id===id);if(!t)return;openModal(modalHead(esc(t.direccion))+'<p class="sub">'+esc(t.unidad)+' · '+esc(t.propiedad)+' · '+esc(userName(t.responsable))+'</p><div class="detail-grid"><div><small>Fecha</small>'+label(t.fecha,{weekday:'long',day:'numeric',month:'long'})+'</div><div><small>Horario</small>'+esc(t.hora)+' hs · '+Number(t.duracion)+' min</div><div><small>Tipo de limpieza</small>'+esc(t.tipo)+'</div><div><small>Estado</small>'+badge(t)+'</div></div>'+keyBox(t)+'<p style="white-space:pre-wrap">'+esc(t.observaciones||'Sin observaciones adicionales.')+'</p><a class="map" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t.direccion+', Córdoba, Argentina')+'">↗ Cómo llegar</a><form id="quickForm" class="quick"><div class="formgrid"><label>Estado<select name="estado">'+STATES.map(s=>'<option '+(s===t.estado?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="full">Comentarios de limpieza<textarea name="comentarios" maxlength="2000" placeholder="Ej.: faltó papel de cocina, se dejó la llave en recepción…">'+esc(t.comentarios||'')+'</textarea></label></div><p class="form-error" id="formError" role="alert"></p><div class="dialog-actions">'+(admin()?'<button type="button" class="danger" data-delete="'+esc(t.id)+'">Eliminar</button>':'')+'<button type="button" data-edit="'+esc(t.id)+'">Editar / reprogramar</button><button class="primary" type="submit">Guardar estado y comentarios</button></div></form>');$('#quickForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target);await mutate('save',{...t,estado:f.get('estado'),comentarios:String(f.get('comentarios')).trim()},e.target)}}
function editor(id){const old=tasks.find(t=>t.id===id);const t=old||{propiedad:'',direccion:'',unidad:'',fecha:today(),hora:'09:00',duracion:'90',tipo:'Limpieza general',estado:'Pendiente',llaves:'En recepción',observaciones:'',comentarios:'',responsable:(users.find(u=>u.role==='cleaner')||users[0])?.id||''};const inp=(label,name,type='text',full=false)=>'<label class="'+(full?'full':'')+'">'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(t[name])+'" '+(name==='duracion'?'min="15" max="720" step="15"':'maxlength="300"')+' required></label>';openModal(modalHead(old?'Editar limpieza':'Nueva limpieza')+'<form id="taskForm"><div class="formgrid">'+inp('Propiedad / referencia','propiedad','text',true)+inp('Dirección (incluir ciudad si no es Córdoba)','direccion','text',true)+inp('Piso / departamento','unidad')+inp('Fecha','fecha','date')+inp('Horario','hora','time')+inp('Duración en minutos','duracion','number')+inp('Tipo de limpieza','tipo')+'<label>Estado<select name="estado">'+STATES.map(s=>'<option '+(s===t.estado?'selected':'')+'>'+s+'</option>').join('')+'</select></label>'+inp('Ubicación de las llaves','llaves','text',true)+'<label class="full">Responsable<select name="responsable">'+users.map(u=>'<option value="'+esc(u.id)+'" '+(u.id===t.responsable?'selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select></label><label class="full">Observaciones (administración)<textarea name="observaciones" maxlength="2000">'+esc(t.observaciones)+'</textarea></label><label class="full">Comentarios de limpieza<textarea name="comentarios" maxlength="2000">'+esc(t.comentarios||'')+'</textarea></label></div><p class="form-error" id="formError" role="alert"></p><div class="dialog-actions"><button type="button" data-close>Cancelar</button><button class="primary" type="submit">Guardar limpieza</button></div></form>');$('#taskForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const data={...Object.fromEntries(new FormData(e.target)),id:old?.id||'',version:old?.version||''};if(old&&(data.fecha!==old.fecha||data.hora!==old.hora)&&data.estado!=='Realizada')data.estado='Reprogramada';const start=Number(data.hora.slice(0,2))*60+Number(data.hora.slice(3));const overlap=tasks.some(x=>{const st=Number(x.hora.slice(0,2))*60+Number(x.hora.slice(3));return x.id!==data.id&&x.eliminada!=='1'&&x.estado!=='Realizada'&&x.responsable===data.responsable&&x.fecha===data.fecha&&start<st+Number(x.duracion)&&start+Number(data.duracion)>st});if(overlap&&!confirm('El responsable ya tiene una limpieza en ese horario. ¿Guardar igualmente?'))return;await mutate('save',data,e.target)}}
function passwordForm(id){const u=users.find(u=>u.id===id);if(!u)return;openModal(modalHead('Contraseña de '+esc(u.name))+'<form id="pwForm"><div class="formgrid"><label class="full">Nueva contraseña<input name="password" type="text" autocomplete="off" minlength="6" maxlength="100" required placeholder="Mínimo 6 caracteres"></label></div><p class="sub" style="margin-top:12px">Anotala y compartila en persona. La anterior deja de funcionar al instante.</p><p class="form-error" id="formError" role="alert"></p><div class="dialog-actions"><button type="button" data-close>Cancelar</button><button class="primary" type="submit">Guardar contraseña</button></div></form>');$('#pwForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const pw=String(new FormData(e.target).get('password')).trim();if(pw.length<6){$('#formError').textContent='Mínimo 6 caracteres.';return}await mutate('setPassword',{id:u.id,password:pw},e.target)}}
function newUserForm(){openModal(modalHead('Nuevo usuario')+'<form id="userForm"><div class="formgrid"><label>Nombre<input name="name" maxlength="60" required placeholder="Ej.: Lucía"></label><label>ID (sin espacios)<input name="id" pattern="[a-z0-9]{2,20}" maxlength="20" required placeholder="ej.: lucia"></label><label>Rol<select name="role"><option value="cleaner">Equipo de limpieza</option><option value="admin">Administración</option></select></label><label>Contraseña<input name="password" type="text" autocomplete="off" minlength="6" maxlength="100" required></label></div><p class="sub" style="margin-top:12px">Equipo de limpieza: ve y edita toda la agenda, cambia estados y deja comentarios; no puede eliminar limpiezas.</p><p class="form-error" id="formError" role="alert"></p><div class="dialog-actions"><button type="button" data-close>Cancelar</button><button class="primary" type="submit">Crear usuario</button></div></form>');$('#userForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const d=Object.fromEntries(new FormData(e.target));d.id=String(d.id).trim().toLowerCase();await mutate('createUser',d,e.target)}}
async function api(action,task){const response=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,key,task}),signal:AbortSignal.timeout(25000)});if(!response.ok)throw new Error('No se pudo conectar ('+response.status+').');let data;try{data=await response.json()}catch{throw new Error('Revisá la URL /exec y el acceso de Apps Script.')}if(!data.ok)throw new Error(data.error||'No se pudo completar la operación.');return data}
async function refresh(){if(mode!=='live'||polling||busy)return;polling=true;try{const data=await api('list');user=data.user;users=data.users;tasks=data.tasks;render();$('#notice').innerHTML='';$('#sync').textContent='Actualizado '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' · Revisión automática cada 30 s';$('#sync').classList.remove('error')}catch(e){$('#sync').textContent='Sin actualizar: '+e.message;$('#sync').classList.add('error');$('#notice').innerHTML='<div class="notice">No se pudo actualizar. La información visible puede estar desactualizada.</div>'}finally{polling=false}}
const MESSAGES={delete:'Limpieza eliminada',save:'Limpieza guardada',setPassword:'Contraseña actualizada',createUser:'Usuario creado',removeUser:'Usuario quitado'};
function demoMutate(action,data){if(action==='delete')tasks=tasks.filter(t=>t.id!==data.id);else if(action==='save'){const t={...data,id:data.id||crypto.randomUUID(),version:String(Number(data.version||0)+1),eliminada:'0'};tasks=tasks.filter(x=>x.id!==t.id).concat(t)}else if(action==='setPassword'){/* la demo no guarda contraseñas */}else if(action==='createUser'){if(users.some(u=>u.id===data.id))throw new Error('Ya existe un usuario con ese ID.');users.push({id:data.id,name:data.name,role:data.role})}else if(action==='removeUser')users=users.filter(u=>u.id!==data.id);localStorage.setItem('srur-demo-v2',JSON.stringify(tasks))}
async function mutate(action,data,form){busy=true;form?.querySelectorAll('button').forEach(b=>b.disabled=true);try{if(mode==='demo')demoMutate(action,data);else{const r=await api(action,data);if(r.users)users=r.users;if(action==='setPassword'&&data.id===user.id){key=data.password;if(readStore('srur-session',null))localStorage.setItem('srur-session',JSON.stringify(key))}}$('#modal').close();toast(MESSAGES[action]||'Guardado');render()}catch(e){const target=$('#formError');if(target)target.textContent=e.message;else toast(e.message)}finally{busy=false;form?.querySelectorAll('button').forEach(b=>b.disabled=false);if(mode==='live')await refresh()}}
async function login(candidate,password,remember){url=candidate;key=password;const data=await api('list');user=data.user;users=data.users;tasks=data.tasks;mode='live';page='agenda';localStorage.setItem('srur-url',JSON.stringify(url));if(remember)localStorage.setItem('srur-session',JSON.stringify(key));render();$('#sync').textContent='Conectado · Revisión automática cada 30 s';$('#sync').classList.remove('error');$('#notice').innerHTML='';toast('Hola, '+user.name)}
function connection(){openModal(modalHead('Ingresar')+'<p class="sub">Ingresá con tu contraseña. El servidor determina tu acceso.</p><form id="login"><div class="formgrid" style="margin-top:20px">'+(APPS_SCRIPT_URL?'':'<label class="full">URL de Apps Script<input name="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(url)+'" required></label>')+'<label class="full">Contraseña<input name="key" type="password" autocomplete="current-password" required minlength="6"></label><label class="full check"><input type="checkbox" name="remember" checked> Recordar en este dispositivo</label></div><p id="formError" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close>Cancelar</button><button class="primary">Ingresar</button></div></form>');$('#login').onsubmit=async e=>{e.preventDefault();if(busy)return;const values=new FormData(e.target);const candidate=String(values.get('url')||APPS_SCRIPT_URL).trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(candidate)){$('#formError').textContent='Usá la URL de implementación terminada en /exec.';return}busy=true;e.target.querySelector('button.primary').disabled=true;try{await login(candidate,String(values.get('key')).trim(),!!values.get('remember'));$('#modal').close()}catch(err){key='';$('#formError').textContent=err.message}finally{busy=false;$('#login button.primary')?.removeAttribute('disabled')}}}
function logout(){key='';mode='demo';user={...DEMO_USER};users=demoUsers();page='agenda';localStorage.removeItem('srur-session');loadDemo();$('#notice').innerHTML='';$('#sync').textContent='Sesión cerrada. Demo local con datos ficticios.';render()}
$('#switchRole').onclick=()=>{if(mode!=='demo')return;user=admin()?{...DEMO_USER}:{...DEMO_ADMIN};page='agenda';$('#dateFilter').value='';render()};$('#connect').onclick=()=>{if(mode==='live')logout();else connection()};$('#add').onclick=()=>editor();['search','stateFilter','dateFilter'].forEach(id=>$('#'+id).addEventListener('input',render));
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){if(!busy)$('#modal').close()}if(b.dataset.tab){tab=b.dataset.tab;day='';render()}if(b.dataset.page){page=b.dataset.page;day='';$('#dateFilter').value='';render()}if(b.dataset.week){week=shift(week,7*Number(b.dataset.week));day='';render()}if(b.dataset.day){day=day===b.dataset.day?'':b.dataset.day;render()}if(b.hasAttribute('data-today')){tab='today';week=monday(today());day='';$('#dateFilter').value='';render()}if(b.hasAttribute('data-reset')){day='';$('#search').value='';$('#stateFilter').value='';$('#dateFilter').value='';render()}if(b.dataset.detail)detail(b.dataset.detail);if(b.dataset.edit){$('#modal').close();editor(b.dataset.edit)}if(b.dataset.password)passwordForm(b.dataset.password);if(b.hasAttribute('data-new-user'))newUserForm();if(b.dataset.removeUser&&admin()&&!busy){const u=users.find(u=>u.id===b.dataset.removeUser);if(u&&confirm('¿Quitar el acceso de '+u.name+'? Sus limpiezas quedan en la agenda.'))await mutate('removeUser',{id:u.id})}if(b.dataset.delete&&admin()&&!busy){const t=tasks.find(t=>t.id===b.dataset.delete);if(t&&confirm('¿Eliminar esta limpieza de la agenda?'))await mutate('delete',t)}});
$('#modal').addEventListener('cancel',e=>{if(busy)e.preventDefault()});window.addEventListener('storage',e=>{if(e.key==='srur-demo-v2'&&mode==='demo'){loadDemo();render()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('online',refresh);setInterval(()=>{if(!document.hidden)refresh()},30000);loadDemo();render();
(async()=>{const saved=readStore('srur-session','');if(saved&&url){try{await login(url,saved,true)}catch(e){localStorage.removeItem('srur-session');$('#sync').textContent='No se pudo reingresar automáticamente: '+e.message}}})();
</script></body></html>
